              borderBottom: darkMode ? '1px solid rgba(255, 255, 255, 0.08)' : '1px solid rgba(45, 37, 30, 0.08)',

            }}>
              <div onClick={onNavigateHome} style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>

          const { darkMode } = React.useContext(ThemeContext);
          const inputStyle = {
            padding: '0.75rem 1rem', borderRadius: '12px', fontSize: '0.9rem', outline: 'none',
            border: darkMode ? '1px solid rgba(255,255,255,0.1)' : '1px solid rgba(0,0,0,0.1)',
            backgroundColor: darkMode ? '#1e1e1e' : '#ffffff', color: darkMode ? '#ffffff' : '#2d251e',
          };
          return (
            <div style={{
              display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '1rem',
              padding: '1.5rem', borderRadius: '20px', marginBottom: '3rem',
              backgroundColor: darkMode ? 'rgba(30, 30, 30, 0.6)' : 'rgba(255, 255, 255, 0.6)',
              backdropFilter: 'blur(20px)', border: '1px solid rgba(0,0,0,0.05)'
            }}>
              <input 
                type="text" placeholder="Search name or breed..." value={filters.query}
                onChange={e => setFilters(p => ({ ...p, query: e.target.value }))} style={{ ...inputStyle, gridColumn: 'span 2' }}
              />
              <select value={filters.species} onChange={e => setFilters(p => ({ ...p, species: e.target.value }))} style={inputStyle}>
                <option value="All">All Species</option>
                <option value="Dog">Dog</option>
                <option value="Cat">Cat</option>
                <option value="Rabbit">Rabbit</option>
                <option value="Bird">Bird</option>
                <option value="Hamster">Hamster</option>
              </select>
              <select value={filters.gender} onChange={e => setFilters(p => ({ ...p, gender: e.target.value }))} style={inputStyle}>
                <option value="All">Any Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>
          );

            <div 
              onClick={onCardClick}
              onMouseEnter={() => setHover(true)}
              onMouseLeave={() => setHover(false)}
              style={{
                borderRadius: '24px', overflow: 'hidden', cursor: 'pointer', position: 'relative',
                backgroundColor: darkMode ? 'rgba(30, 30, 30, 0.7)' : 'rgba(255, 255, 255, 0.7)',
                backdropFilter: 'blur(20px)', border: '1px solid rgba(0,0,0,0.05)',
                transform: hover ? 'translateY(-6px)' : 'translateY(0)',
                boxShadow: hover ? '0 20px 40px rgba(0,0,0,0.12)' : '0 10px 20px rgba(0,0,0,0.02)',
                transition: 'all 0.3s cubic-bezier(0.16, 1, 0.3, 1)'
              }}
            >
              <button 
                onClick={(e) => { e.stopPropagation(); toggleFavorite(pet.id); }}
                style={{ position: 'absolute', top: '1rem', right: '1rem', zIndex: 10, background: '#fff', border: 'none', borderRadius: '50%', width: '36px', height: '36px', cursor: 'pointer', boxShadow: '0 4px 10px rgba(0,0,0,0.1)' }}
              >
                <span style={{ filter: isFav ? 'none' : 'grayscale(100%)' }}>❤️</span>
              </button>
              
              <img src={pet.image} alt={pet.name} style={{ width: '100%', height: '220px', objectFit: 'cover' }} />
              
              <div style={{ padding: '1.25rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <h3 style={{ fontSize: '1.3rem', fontWeight: 700 }}>{pet.name}</h3>
                    <p style={{ fontSize: '0.8rem', opacity: 0.6 }}>{pet.breed}</p>
                  </div>
                  <div style={{ transform: hover ? 'scale(1.08) rotate(4deg)' : 'scale(1)', transition: 'transform 0.3s' }}>
                    <QRCodeGenerator value={pet.id} />
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '0.4rem', margin: '1rem 0', flexWrap: 'wrap' }}>
                  <span style={{ fontSize: '0.75rem', padding: '0.25rem 0.5rem', borderRadius: '6px', background: 'rgba(255, 107, 53, 0.1)', color: '#ff6b35', fontWeight: 600 }}>{pet.age}</span>
                  <span style={{ fontSize: '0.75rem', padding: '0.25rem 0.5rem', borderRadius: '6px', background: 'rgba(0,0,0,0.05)' }}>{pet.gender}</span>
                  <span style={{ fontSize: '0.75rem', padding: '0.25rem 0.5rem', borderRadius: '6px', background: pet.status === 'Available' ? 'rgba(40,167,69,0.15)' : '#eee', color: pet.status === 'Available' ? '#28a745' : '#777' }}>{pet.status}</span>
                </div>

                <button 
                  onClick={(e) => { e.stopPropagation(); onAdoptClick(pet); }}
                  disabled={!isAvailable}
                  style={{
                    width: '100%', padding: '0.75rem', borderRadius: '12px', border: 'none', fontWeight: 600, fontSize: '0.85rem',
                    background: isAvailable ? 'linear-gradient(135deg, #ff6b35 0%, #e0531a 100%)' : '#ccc',
                    color: '#fff', cursor: isAvailable ? 'pointer' : 'not-allowed'
                  }}
                >
                  {isAvailable ? 'Interested in Adoption' : 'Adopted'}
                </button>
              </div>
            </div>
          );
        }

        function PetDetails({ pet, onBackHome, onAdoptClick }) {
          const { darkMode } = React.useContext(ThemeContext);
          return (
            <div style={{ maxWidth: '1000px', margin: '2rem auto', padding: '0 1.5rem' }}>
              <button onClick={onBackHome} style={{ background: 'none', border: 'none', color: '#ff6b35', cursor: 'pointer', fontWeight: 600, marginBottom: '1.5rem' }}>← Back to Showcase Hub</button>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '2.5rem' }}>
                <div>
                  <img src={pet.image} alt={pet.name} style={{ width: '100%', height: '400px', objectFit: 'cover', borderRadius: '24px', boxShadow: '0 15px 30px rgba(0,0,0,0.1)' }} />
                  <div style={{ marginTop: '1.5rem', padding: '1.5rem', borderRadius: '20px', background: 'rgba(255,107,53,0.05)', border: '1px dashed #ff6b35', textAlign: 'center' }}>
                    <span style={{ fontSize: '1.2rem' }}>📹 Virtual Reality Interaction Stream Enabled</span>
                  </div>
                </div>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <h2 style={{ fontSize: '2.5rem', fontWeight: 800 }}>{pet.name}</h2>
                    <QRCodeGenerator value={pet.id} />
                  </div>
                  <p style={{ color: '#ff6b35', fontWeight: 600, marginBottom: '1.5rem' }}>{pet.breed} • {pet.id}</p>
                  
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem', marginBottom: '1.5rem' }}>
                    <div style={{ padding: '0.75rem', background: 'rgba(0,0,0,0.03)', borderRadius: '12px' }}><strong>Age:</strong> {pet.age}</div>
                    <div style={{ padding: '0.75rem', background: 'rgba(0,0,0,0.03)', borderRadius: '12px' }}><strong>Weight:</strong> {pet.weight}</div>
                    <div style={{ padding: '0.75rem', background: 'rgba(0,0,0,0.03)', borderRadius: '12px' }}><strong>Energy:</strong> {pet.energyLevel}</div>
                    <div style={{ padding: '0.75rem', background: 'rgba(0,0,0,0.03)', borderRadius: '12px' }}><strong>Training:</strong> {pet.trainingLevel}</div>
                  </div>

                  <p style={{ lineHeight: 1.6, marginBottom: '1.5rem', opacity: 0.9 }}>{pet.description}</p>
                  <h4 style={{ marginBottom: '0.5rem' }}>Rescue Narrative</h4>
                  <p style={{ fontStyle: 'italic', opacity: 0.7, marginBottom: '2rem' }}>"{pet.rescueStory}"</p>

                  <div style={{ padding: '1.2rem', borderRadius: '16px', background: darkMode ? '#2a2a2a' : '#fff9f3', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div><span style={{ fontSize: '0.8rem', opacity: 0.6 }}>Adoption Fee</span><h3 style={{ color: '#ff6b35', fontWeight: 800 }}>{pet.fee}</h3></div>
                    <button 
                      onClick={() => onAdoptClick(pet)} disabled={pet.status !== 'Available'}
                      style={{ padding: '0.75rem 2rem', borderRadius: '12px', border: 'none', background: 'linear-gradient(135deg, #ff6b35 0%, #e0531a 100%)', color: '#fff', fontWeight: 700, cursor: 'pointer' }}
                    >
                      Apply Now
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function AdoptionModal({ pet, onClose, onSubmit }) {
          const [name, setName] = React.useState('');
          const [phone, setPhone] = React.useState('');
          return (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifycenter: 'center', zIndex: 1000, padding: '1rem', justifyContent: 'center' }}>
              <div style={{ background: '#fff', color: '#000', padding: '2rem', borderRadius: '24px', width: '100%', maxWidth: '480px', boxShadow: '0 20px 40px rgba(0,0,0,0.2)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
                  <h3>Adoption Application</h3>
                  <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: '1.2rem', cursor: 'pointer' }}>×</button>
                </div>
                <div style={{ background: '#ff6b35', color: '#fff', padding: '0.75rem', borderRadius: '12px', fontSize: '0.8rem', fontWeight: 600, marginBottom: '1rem' }}>
                  Target Profile: {pet.name} ({pet.id}) • Fee: {pet.fee}
                </div>
                <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
                  <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: '0.25rem' }}>Full Name</label>
                  <input type="text" required value={name} onChange={e=>setName(e.target.value)} style={{ width: '100%', padding: '0.6rem', borderRadius: '8px', border: '1px solid #ccc', marginBottom: '1rem' }} />
                  
                  <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: '0.25rem' }}>Phone Number</label>
                  <input type="tel" required value={phone} onChange={e=>setPhone(e.target.value)} style={{ width: '100%', padding: '0.6rem', borderRadius: '8px', border: '1px solid #ccc', marginBottom: '1rem' }} />

                  <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: '0.25rem' }}>Living Environment</label>
                  <select style={{ width: '100%', padding: '0.6rem', borderRadius: '8px', border: '1px solid #ccc', marginBottom: '1.5rem' }}>
                    <option>Apartment Complex</option>
                    <option>Independent Suburban Estate</option>
                    <option>Rural Open Farm</option>
                  </select>

                  <button type="submit" style={{ width: '100%', padding: '0.8rem', borderRadius: '12px', border: 'none', background: '#ff6b35', color: '#fff', fontWeight: 700, cursor: 'pointer' }}>
                    Submit Formal Request
                  </button>
                </form>
              </div>
            </div>
          );
        }

        function SuccessModal({ onClose }) {
          return (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2000 }}>
              <div style={{ background: '#fff', color: '#000', padding: '3rem', borderRadius: '32px', textAlign: 'center', maxWidth: '400px', width: '90%' }}>
                <span style={{ fontSize: '3.5rem' }}>🎉</span>
                <h3 style={{ margin: '1rem 0', fontSize: '1.7rem', fontWeight: 800 }}>Dossier Received!</h3>
                <p style={{ opacity: 0.7, fontSize: '0.9rem', lineHeight: 1.5, marginBottom: '1.5rem' }}>
                  Your request has been successfully processed through Kindred's smart shelter interface network.
                </p>
                <button onClick={onClose} style={{ padding: '0.6rem 2rem', borderRadius: '99px', border: 'none', background: '#2d251e', color: '#fff', fontWeight: 600, cursor: 'pointer' }}>Return to Hub</button>
              </div>
            </div>
          );
        }

        function Footer() {
          return (
            <footer style={{ padding: '3rem 2rem', textAlign: 'center', borderTop: '1px solid rgba(0,0,0,0.05)', opacity: 0.6, fontSize: '0.8rem' }}>
              <p>© 2026 Kindred Smart Adoption Platform Inc. Powered by high-fidelity React components.</p>
            </footer>
          );
        }

        // --- 4. CORE APPLICATION ROOT ---
        function App() {
          const [darkMode, setDarkMode] = React.useState(() => localStorage.getItem('k-dark') === 'true');
          const [favorites, setFavorites] = React.useState(() => JSON.parse(localStorage.getItem('k-favs') || '[]'));
          const [filters, setFilters] = React.useState({ query: '', species: 'All', gender: 'All' });
          const [selectedPetId, setSelectedPetId] = React.useState(null);
          const [activePetForModal, setActivePetForModal] = React.useState(null);
          const [showSuccess, setShowSuccess] = React.useState(false);
          const [loading, setLoading] = React.useState(false);

          React.useEffect(() => localStorage.setItem('k-dark', darkMode), [darkMode]);
          React.useEffect(() => localStorage.setItem('k-favs', JSON.stringify(favorites)), [favorites]);

          const toggleFavorite = (id) => {
            setFavorites(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          };

          const filteredPets = petData.filter(pet => {
            const matchesQuery = pet.name.toLowerCase().includes(filters.query.toLowerCase()) || pet.breed.toLowerCase().includes(filters.query.toLowerCase());
            const matchesSpecies = filters.species === 'All' || pet.species === filters.species;
            const matchesGender = filters.gender === 'All' || pet.gender === filters.gender;
            return matchesQuery && matchesSpecies && matchesGender;
          });

          const currentPet = petData.find(p => p.id === selectedPetId);

          return (
            <ThemeContext.Provider value={{ darkMode, setDarkMode }}>
              <FavoritesContext.Provider value={{ favorites, toggleFavorite }}>
                <div style={{
                  backgroundColor: darkMode ? '#121212' : '#fdfbf7',
                  color: darkMode ? '#e5e5e5' : '#2d251e',
                  minHeight: '100vh', transition: 'background-color 0.3s'
                }}>
                  <Navbar onNavigateHome={() => setSelectedPetId(null)} favoritesCount={favorites.length} />
                  
                  {selectedPetId ? (
                    <PetDetails pet={currentPet} onBackHome={() => setSelectedPetId(null)} onAdoptClick={setActivePetForModal} />
                  ) : (
                    <>
                      <Hero onExploreClick={() => document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' })} />
                      <div id="gallery" style={{ maxWidth: '1100px', margin: '0 auto', padding: '0 1.5rem 4rem 1.5rem' }}>
                        <SearchBar filters={filters} setFilters={setFilters} />
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '2rem' }}>
                          {filteredPets.map(pet => (
                            <PetCard key={pet.id} pet={pet} onCardClick={() => setSelectedPetId(pet.id)} onAdoptClick={setActivePetForModal} />
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  <Footer />

                  {activePetForModal && (
                    <AdoptionModal 
                      pet={activePetForModal} 
                      onClose={() => setActivePetForModal(null)} 
                      onSubmit={() => { setActivePetForModal(null); setShowSuccess(true); }} 
                    />
                  )}

                  {showSuccess && <SuccessModal onClose={() => setShowSuccess(false)} />}
                </div>
              </FavoritesContext.Provider>
            </ThemeContext.Provider>
          );
        }

        const root = RoyalReactDOM = KansaiReactDOM = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
